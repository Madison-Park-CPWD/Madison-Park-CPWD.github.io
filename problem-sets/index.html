<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Practice</title>
<style>
  :root {
    --bg-app: #141a24;
    --bg-panel: #1b2330;
    --bg-panel-raised: #212b3a;
    --border: #2c3849;
    --text-primary: #e7ecf3;
    --text-secondary: #93a2b8;
    --text-faint: #5c6b81;
    --accent: #f2b134;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg-app);
    color: var(--text-primary);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    max-width: 720px;
    width: 100%;
    padding: 2rem 1.5rem;
  }
  .eyebrow {
    font-family: var(--font-mono);
    color: var(--accent);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    margin: 0 0 0.4rem;
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: 1.6rem;
  }
  .sub {
    color: var(--text-secondary);
    margin: 0 0 2rem;
    font-size: 0.95rem;
  }
  .tracks {
    display: grid;
    gap: 1rem;
  }
  .track {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem 1.4rem;
    transition: border-color 0.15s, background 0.15s;
  }
  .track:hover, .track:focus-visible {
    border-color: var(--accent);
    background: var(--bg-panel-raised);
    outline: none;
  }
  .track .tag {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .track h2 {
    margin: 0.25rem 0 0.35rem;
    font-size: 1.15rem;
  }
  .track p {
    margin: 0;
    color: var(--text-secondary);
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .track.disabled {
    opacity: 0.55;
    cursor: default;
    pointer-events: none;
  }
  .track .arrow {
    float: right;
    color: var(--accent);
    font-family: var(--font-mono);
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">&gt;&gt;&gt; coding practice</p>
    <h1>Pick a track</h1>
    <p class="sub">Exercises run right in your browser — no login required.</p>

    <div class="tracks">
      <a class="track" href="python/">
        <span class="arrow">&rarr;</span>
        <span class="tag">Python</span>
        <h2>Python Practice</h2>
        <p>Variables, math operators, input/output, f-strings, and beyond.</p>
      </a>

      <a class="track disabled" href="webdev/">
        <span class="tag">Web Dev</span>
        <h2>HTML, CSS &amp; JavaScript Practice</h2>
        <p>Coming soon.</p>
      </a>
    </div>
  </div>
</body>
</html>
